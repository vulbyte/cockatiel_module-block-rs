[package]
name = "cockatiel-block"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — moderator blocking + user appeals (!block/!unblock/!appeal/!appeals)"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "7a12755c380e09667d57cec2a1a6c541a58e952c" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }
